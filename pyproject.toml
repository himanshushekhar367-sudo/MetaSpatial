[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metaspatial"
version = "0.3.0"
description = "Transport-aware prediction of spatial metabolomes from spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "MetaSpatial contributors"}]
dependencies = ["numpy>=1.23","scipy>=1.9","scikit-learn>=1.2","pandas>=1.5","anndata>=0.9","scanpy>=1.9"]

[project.urls]
Homepage = "https://github.com/himanshushekhar367-sudo/MetaSpatial"

[tool.setuptools]
packages = ["metaspatial"]
